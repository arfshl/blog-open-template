media: media

content:
  - name: pages
    label: Blog Posts
    type: collection
    path: docs
    fields:
      - name: title
        label: Title
        type: string

      - name: description
        label: Description
        type: string
        required: false

      - name: date
        label: Date
        type: date

      - name: category
        label: Category
        type: string

      - name: tags
        label: Tags
        type: select
        options:
         multiple: true
         creatable: true
         placeholder: "Select or type tags..."
         values:
           - "p1"
           - "p2"
           - "p3"
           - "p4"
           - "p5"
           - "p6"
           - "p7"
           - "p8"
           - "p9"
           - "p0"


      - name: body
        label: Content
        type: rich-text

      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"